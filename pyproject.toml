[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msc-applied-probabilistic-models-lidstone"
version = "1.0.0"
description = "Lidstone-smoothed unigram language modeling and perplexity evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
]
dependencies = []

[project.scripts]
apm-lidstone = "solution.ex2:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["solution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
